name: Synchroniser BENCHMARK.xlsx après révision des dossiers IIIF

on:
  push:
    branches:
      - chatgpt/rattrapage-documentation-2026-11-14
    paths:
      - 'institutions/**'
      - 'data/perimetre.csv'
      - 'scripts/build_benchmark.py'
      - 'scripts/suivi.py'
      - 'scripts/valider_preuves_rattrapage.py'
      - 'CONSIGNE.md'
      - 'METHODOLOGY.md'
      - 'requirements.txt'
      - '.github/workflows/benchmark-sync-rattrapage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark-sync-rattrapage
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche de révision
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances du générateur existant
        run: python -m pip install -r requirements.txt
      - name: Valider les justifications et les preuves du suivi
        run: python scripts/suivi.py validate
      - name: Valider les preuves complémentaires ajoutées aux fiches
        run: python scripts/valider_preuves_rattrapage.py .
      - name: Régénérer le classeur avec le générateur canonique du dépôt
        run: python scripts/build_benchmark.py
      - name: Vérifier l'intégrité minimale du classeur produit
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          f = Path('BENCHMARK.xlsx')
          assert f.exists() and f.stat().st_size > 20000, 'Classeur absent ou incomplet'
          with ZipFile(f) as z:
              bad = z.testzip()
              assert bad is None, f'Archive XLSX corrompue : {bad}'
              assert 'xl/workbook.xml' in z.namelist()
              assert len([x for x in z.namelist() if x.startswith('xl/worksheets/sheet') and x.endswith('.xml')]) >= 10
          print('BENCHMARK.xlsx régénéré et structure ZIP/XML contrôlée :', f.stat().st_size, 'octets')
          PY
      - name: Synchroniser sans écraser les modifications concurrentes
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="chatgpt/rattrapage-documentation-2026-11-14"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Ne jamais rebaser un classeur construit sur des donnees anterieures.
          # Si le depot a bouge, recharger la source et recalculer le classeur.
          for tentative in 1 2 3 4; do
            git fetch origin "$BRANCH"
            LOCAL="$(git rev-parse HEAD)"
            REMOTE="$(git rev-parse "origin/$BRANCH")"
            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "La branche a avance pendant la CI : revalidation et regeneration (tentative $tentative)"
              git reset --hard "origin/$BRANCH"
              python scripts/suivi.py validate
              python scripts/valider_preuves_rattrapage.py .
              python scripts/build_benchmark.py
            fi
            git add BENCHMARK.xlsx
            if git diff --cached --quiet; then
              echo "BENCHMARK.xlsx correspond aux fichiers institutionnels actuels"
              exit 0
            fi
            git commit -m "Régénérer BENCHMARK.xlsx depuis les données et suivis institutionnels"
            if git push origin "HEAD:$BRANCH"; then
              echo "Classeur synchronise sur la branche"
              exit 0
            fi
            echo "Nouveau commit concurrent : nouvelle generation requise"
          done
          echo "::error::Impossible de synchroniser apres quatre tentatives sans risques de perte"
          exit 1
      - name: Vérifier et publier le classeur finalement retenu
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          f = Path('BENCHMARK.xlsx')
          assert f.exists() and f.stat().st_size > 20000
          with ZipFile(f) as z:
              assert z.testzip() is None
              assert 'xl/workbook.xml' in z.namelist()
          print('Version finale du classeur validee :', f.stat().st_size)
          PY
      - name: Publier un artefact de sécurité
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-IIIF-reconcilie
          path: BENCHMARK.xlsx
          retention-days: 14
