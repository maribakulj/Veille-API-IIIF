name: veille-api-iiif

on:
  push:
    paths:
      - 'institutions/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/veille.yml'
  schedule:
    - cron: '0 6 * * 1'   # chaque lundi à 6 h UTC : veille des sources
  workflow_dispatch:

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Validation des fiches
        run: python scripts/validate.py
      - name: Veille des sources (planifiée ou manuelle)
        if: github.event_name != 'push'
        run: python scripts/check_sources.py
      - name: Génération Excel et CSV
        run: python scripts/build_xlsx.py
      - name: Commit des sorties
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "chore: mise à jour automatique de la veille"
            git push
          fi
