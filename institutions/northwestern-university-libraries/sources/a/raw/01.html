      Redoc.init({"openapi":"3.1.0","info":{"title":"Northwestern University Libraries Digital Collections API","description":"# Overview\n\n## Introduction\n\nOur mission is to create, acquire, describe, and archive digital objects for long-term preservation, as well as to develop and deploy software that supports the discovery, access, and use of digital resources by members of Northwestern University, scholarly communities, and the public. The API provides access to the rich collections of the Northwestern University Libraries and allows users to explore and discover new resources.\n\nThis API provides access to the Library's digital resources to easily integrate the data into your own applications and workflows, regardless of your preferred programming language or framework. In fact, we use the API internally to provide the data and search functionality for our [Digital Collections site](https://dc.library.northwestern.edu). We also publish a command-line interface (CLI) [application](https://github.com/nulib/nuldc) written in Python that provides built-in commands for fetching and querying the API from your terminal. See the code examples below for ways to interact with the API using a variety of programming languages.\n\nCheck out the [OpenAPI specification](#tag/Collection) for detailed descriptions of each API endpoint, with request and response examples.\n\n### Application Programming Interfaces (APIs)\n\nAn API allows end users to interact with the data stored in the Digital Collections in a structured and programmatic way, which makes it possible to integrate the data into own applications and workflows. Most programming languages and frameworks provide the scope to send and receive information using HTTP requests. The Northwestern University Libraries Digital Collections API is designed with flexibility in mind and works with a wide range of programming languages and frameworks.\n\nOur API allows developers to access the data in the Digital Collections API by sending HTTP requests and receiving responses in a format that can be parsed and processed by the application. This makes it simple to fetch and process data, reshaping the data if necessary for integration into your application or project. The API also allows developers to authenticate and authorize their requests using standard protocols such as OAuth, but for now this feature is internal (check back for future updates on authentication/authorization!).\n\n### Representational State Transfer (REST)\n\nWorking with a REST (Representational State Transfer) API is a common method for interacting with web-based services. RESTful APIs use HTTP requests to POST (create), PUT (update), GET (read), and DELETE data. The API's endpoints are typically organized around resources, with a typical RESTful API endpoint being a URL that represents a specific resource or set of resources. The benefits of using a RESTful API include ease of use, as it can be integrated with many programming languages, and it is easy to understand, as it follows conventions of the HTTP protocol. Additionally, RESTful APIs have a stateless architecture, which means that each request is self-contained and does not depend on the previous request, which can make it easier to build and maintain.\n\n### Example\n\n\n\u003cdiv class=\"code-tabs\" id=\"code-tabs-1\">\u003cdiv class=\"code-tabs__labels\" role=\"tablist\">\u003cbutton type=\"button\" class=\"code-tabs__label is-active\" data-tab=\"0\">cURL\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"1\">JavaScript\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"2\">Ruby\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"3\">PowerShell\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"4\">Python\u003c/button>\u003c/div>\u003cdiv class=\"code-tabs__panels\">\u003cdiv class=\"code-tabs__panel is-active\" data-tab=\"0\">\u003cdiv class=\"code-caption\">GET request for a work by identifier\u003c/div>\u003cpre class=\"code-tabs__code language-bash\">\u003ccode>\u003cspan class=\"token function\">curl\u003c/span> \u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090'\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"1\">\u003cdiv class=\"code-caption\">GET request for a work by identifier\u003c/div>\u003cpre class=\"code-tabs__code language-javascript\">\u003ccode>\u003cspan class=\"token keyword\">let\u003c/span> response \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token keyword\">await\u003c/span> \u003cspan class=\"token function\">fetch\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">;\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">let\u003c/span> data \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token keyword\">await\u003c/span> response\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token function\">text\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">;\u003c/span>&#10;console\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token function\">log\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>data\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">;\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"2\">\u003cdiv class=\"code-caption\">GET request for a work by identifier\u003c/div>\u003cpre class=\"code-tabs__code language-ruby\">\u003ccode>\u003cspan class=\"token keyword\">require\u003c/span> \u003cspan class=\"token string-literal\">\u003cspan class=\"token string\">'uri'\u003c/span>\u003c/span>&#10;\u003cspan class=\"token keyword\">require\u003c/span> \u003cspan class=\"token string-literal\">\u003cspan class=\"token string\">'net/http'\u003c/span>\u003c/span>&#10;\u003cspan class=\"token keyword\">require\u003c/span> \u003cspan class=\"token string-literal\">\u003cspan class=\"token string\">'openssl'\u003c/span>\u003c/span>&#10;&#10;url \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token constant\">URI\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string-literal\">\u003cspan class=\"token string\">\"https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090\"\u003c/span>\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;http \u003cspan class=\"token operator\">=\u003c/span> Net\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token class-name\">HTTP\u003c/span>\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token keyword\">new\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>url\u003cspan class=\"token punctuation\">.\u003c/span>host\u003cspan class=\"token punctuation\">,\u003c/span> url\u003cspan class=\"token punctuation\">.\u003c/span>port\u003cspan class=\"token punctuation\">)\u003c/span>&#10;http\u003cspan class=\"token punctuation\">.\u003c/span>use_ssl \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token boolean\">true\u003c/span>&#10;http\u003cspan class=\"token punctuation\">.\u003c/span>verify_mode \u003cspan class=\"token operator\">=\u003c/span> OpenSSL\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token constant\">SSL\u003c/span>\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token constant\">VERIFY_NONE\u003c/span>&#10;&#10;request \u003cspan class=\"token operator\">=\u003c/span> Net\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token constant\">HTTP\u003c/span>\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token class-name\">Get\u003c/span>\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token keyword\">new\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>url\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;response \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>request\u003cspan class=\"token punctuation\">)\u003c/span>&#10;puts response\u003cspan class=\"token punctuation\">.\u003c/span>read_body\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"3\">\u003cdiv class=\"code-caption\">GET request for a work by identifier\u003c/div>\u003cpre class=\"code-tabs__code language-powershell\">\u003ccode>\u003cspan class=\"token variable\">$headers\u003c/span> = @\u003cspan class=\"token punctuation\">{\u003c/span>\u003cspan class=\"token punctuation\">}\u003c/span>&#10;\u003cspan class=\"token variable\">$reqUrl\u003c/span> = \u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090'\u003c/span>&#10;&#10;\u003cspan class=\"token variable\">$response\u003c/span> = \u003cspan class=\"token function\">Invoke-RestMethod\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Uri \u003cspan class=\"token variable\">$reqUrl\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Method Get \u003cspan class=\"token operator\">-\u003c/span>Headers \u003cspan class=\"token variable\">$headers\u003c/span>&#10;\u003cspan class=\"token variable\">$response\u003c/span> \u003cspan class=\"token punctuation\">|\u003c/span> \u003cspan class=\"token function\">ConvertTo-Json\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"4\">\u003cdiv class=\"code-caption\">GET request for a work by identifier\u003c/div>\u003cpre class=\"code-tabs__code language-python\">\u003ccode>\u003cspan class=\"token keyword\">import\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client&#10;&#10;conn \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client\u003cspan class=\"token punctuation\">.\u003c/span>HTTPSConnection\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"api.dc.library.northwestern.edu\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;conn\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"GET\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span> \u003cspan class=\"token string\">\"/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;response \u003cspan class=\"token operator\">=\u003c/span> conn\u003cspan class=\"token punctuation\">.\u003c/span>getresponse\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;result \u003cspan class=\"token operator\">=\u003c/span> response\u003cspan class=\"token punctuation\">.\u003c/span>read\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">print\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>result\u003cspan class=\"token punctuation\">.\u003c/span>decode\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"utf-8\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/div>\n\n## OpenSearch\n\nWe use [OpenSearch](https://opensearch.org) to provide the search functionality behind our API. One of the key advantages of using a tool like OpenSearch is the scope to perform advanced searches using tokenization, custom queries, and aggregations. Tokenization allows for the search engine to break down text into smaller units, or tokens, for more precise searching. This allows users to search for specific words or phrases within the digital collections. Custom queries allow users to create more complex searches using Boolean operators and other advanced search features. Aggregations provide the scope to group results by specific fields, such as by creator or subject, allowing users to quickly filter and analyze large sets of data. With range queries, users can perform searches based on specific numerical or date ranges, such as finding all resources that were created between two specific dates. This is particularly useful when searching large datasets. See the [OpenSearch documentation](https://opensearch.org/docs/latest/) for more information about using OpenSearch's many features.\n\n### Example\n\n\n\u003cdiv class=\"code-tabs\" id=\"code-tabs-2\">\u003cdiv class=\"code-tabs__labels\" role=\"tablist\">\u003cbutton type=\"button\" class=\"code-tabs__label is-active\" data-tab=\"0\">cURL\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"1\">JavaScript\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"2\">Ruby\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"3\">PowerShell\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"4\">Python\u003c/button>\u003c/div>\u003cdiv class=\"code-tabs__panels\">\u003cdiv class=\"code-tabs__panel is-active\" data-tab=\"0\">\u003cdiv class=\"code-caption\">range search via POST request:\u003c/div>\u003cpre class=\"code-tabs__code language-bash\">\u003ccode>\t\u003cspan class=\"token function\">curl\u003c/span> \u003cspan class=\"token parameter variable\">-X\u003c/span> \u003cspan class=\"token string\">'POST'\u003c/span> \u003cspan class=\"token punctuation\">\\\u003c/span>&#10;\t\u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/search'\u003c/span> \u003cspan class=\"token punctuation\">\\\u003c/span>&#10;\t\u003cspan class=\"token parameter variable\">--header\u003c/span> \u003cspan class=\"token string\">'Content-Type: application/json'\u003c/span> \u003cspan class=\"token punctuation\">\\\u003c/span>&#10;\t--data-raw \u003cspan class=\"token string\">'{&#10;\t\"query\": {&#10;\t\t\"range\": {&#10;\t\t\t\"modified_date\": {&#10;\t\t\t\t\"gt\": \"2023-01-01\",&#10;\t\t\t\t\"lt\": \"2023-02-01\"&#10;\t\t\t}&#10;\t\t}&#10;\t},&#10;\t\"sort\": [{\"modified_date\": \"asc\" }]&#10;}'\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"1\">\u003cdiv class=\"code-caption\">range search via POST request:\u003c/div>\u003cpre class=\"code-tabs__code language-javascript\">\u003ccode>\u003cspan class=\"token keyword\">let\u003c/span> headersList \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;\u003cspan class=\"token string-property property\">\"Content-Type\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token string\">\"application/json\"\u003c/span>&#10;\u003cspan class=\"token punctuation\">}\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">let\u003c/span> bodyContent \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token constant\">JSON\u003c/span>\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token function\">stringify\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">{\u003c/span>&#10;  \u003cspan class=\"token string-property property\">\"query\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;  \u003cspan class=\"token string-property property\">\"range\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;\t\t\t\u003cspan class=\"token string-property property\">\"modified_date\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;\t\t\t\t\u003cspan class=\"token string-property property\">\"gt\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token string\">\"2023-01-01\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;\t\t\t\t\u003cspan class=\"token string-property property\">\"lt\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token string\">\"2023-02-01\"\u003c/span>&#10;\t\t\t\u003cspan class=\"token punctuation\">}\u003c/span>&#10;\t\t\u003cspan class=\"token punctuation\">}\u003c/span>&#10;\t\u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;\t\t\u003cspan class=\"token string-property property\">\"sort\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token punctuation\">[\u003c/span>\u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string-property property\">\"modified_date\"\u003c/span>\u003cspan class=\"token operator\">:\u003c/span> \u003cspan class=\"token string\">\"asc\"\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">]\u003c/span>&#10;\u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">;\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">let\u003c/span> response \u003cspan class=\"token operator\">=\u003c/span> \u003cspan >$reqUrl\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Method Post \u003cspan class=\"token operator\">-\u003c/span>Headers \u003cspan class=\"token variable\">$headers\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>ContentType \u003cspan class=\"token string\">'application/json'\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Body \u003cspan class=\"token variable\">$body\u003c/span>&#10;\u003cspan class=\"token variable\">$response\u003c/span> \u003cspan class=\"token punctuation\">|\u003c/span> \u003cspan class=\"token function\">ConvertTo-Json\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"4\">\u003cdiv class=\"code-caption\">boolean search selecting three fields from results:\u003c/div>\u003cpre class=\"code-tabs__code language-python\">\u003ccode>\u003cspan class=\"token keyword\">import\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client&#10;\u003cspan class=\"token keyword\">import\u003c/span> json&#10;&#10;conn \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client\u003cspan class=\"token punctuation\">.\u003c/span>HTTPSConnection\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"api.dc.library.northwestern.edu\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;headersList \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;\u003cspan class=\"token string\">\"Content-Type\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token string\">\"application/json\"\u003c/span>&#10;\u003cspan class=\"token punctuation\">}\u003c/span>&#10;&#10;payload \u003cspan class=\"token operator\">=\u003c/span> json\u003cspan class=\"token punctuation\">.\u003c/span>dumps\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">{\u003c/span>&#10;\t\u003cspan class=\"token string\">\"_source\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">[\u003c/span>\u003cspan class=\"token string\">\"id\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span> \u003cspan class=\"token string\">\"title\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span> \u003cspan class=\"token string\">\"date_created\"\u003c/span>\u003cspan class=\"token punctuation\">]\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;\t\u003cspan class=\"token string\">\"query\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;\t\t\t\u003cspan class=\"token string\">\"bool\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span>&#10;\t\t\t\t\u003cspan class=\"token string\">\"must\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">[\u003c/span>&#10;\t\t\t\t\t\u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string\">\"term\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string\">\"work_type\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token string\">\"Video\"\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;\t\t\t\t\t\u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string\">\"match\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string\">\"all_text\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token string\">\"football\"\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span>&#10;\t\t\t\t\u003cspan class=\"token punctuation\">]\u003c/span>&#10;\t\t\t\u003cspan class=\"token punctuation\">}\u003c/span>&#10;\t\u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;\t\u003cspan class=\"token string\">\"sort\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token punctuation\">[\u003c/span>\u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string\">\"date_created\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token string\">\"asc\"\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">]\u003c/span>&#10;\u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;conn\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"POST\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span> \u003cspan class=\"token string\">\"/api/v2/search\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span> payload\u003cspan class=\"token punctuation\">,\u003c/span> headersList\u003cspan class=\"token punctuation\">)\u003c/span>&#10;response \u003cspan class=\"token operator\">=\u003c/span> conn\u003cspan class=\"token punctuation\">.\u003c/span>getresponse\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;result \u003cspan class=\"token operator\">=\u003c/span> response\u003cspan class=\"token punctuation\">.\u003c/span>read\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">print\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>result\u003cspan class=\"token punctuation\">.\u003c/span>decode\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"utf-8\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/div>\n\n## International Image Interoperability Framework (IIIF)\n\n[IIIF](\u003c[https://iiif.io](https://iiif.io/)>) is a set of open standards for delivering digital objects in a standardized and interoperable way.\n\nThe `?as=iiif` parameter in the API allows users to retrieve resources as IIIF manifests. IIIF manifests allow developers to create user-friendly and interactive front-end interfaces that allows users to easily navigate and explore digital collections. A manifest contains descriptive metadata about a work or a collection as well as information about the structure including related works or file sets. This information can be used to create an intuitive and engaging user interface that allows users to easily explore and interact with the data.\n\nAdditionally, IIIF manifests provide a rich set of metadata that can be used to improve the user experience, such as captions, translations, and descriptions. This metadata can be displayed in the front-end interface to provide users with more context and information about the images they are viewing.\n\nOne of the primary benefits of using IIIF is the scope to easily access and manipulate images and other multimedia resources solely making HTTP requests. The IIIF specification makes allowances for cropping, rotation, and zooming in a standardized way. This allows users to easily access, manipulate, and display images in a consistent way across different applications that implement the specification.\n\nIIIF manifests may include the `navPlace` extension for geographic context. Provide a GeoJSON-like `FeatureCollection` on the work, and only `Feature` entries with `geometry.type` set to `Point` are included in the manifest for plotting.\n\n\u003cdiv class=\"code-caption\">navPlace example\u003c/div>\n\n```json\n{\n  \"navPlace\": {\n    \"type\": \"FeatureCollection\",\n    \"features\": [\n      {\n        \"type\": \"Feature\",\n        \"geometry\": {\n          \"type\": \"Point\",\n          \"coordinates\": [88.3639, 22.5726]\n        },\n        \"properties\": {\n          \"label\": { \"en\": [\"Calcutta\"] },\n          \"summary\": { \"en\": [\"British survey depot\"] }\n        }\n      }\n    ]\n  }\n}\n```\n\n### Example\n\n\n\u003cdiv class=\"code-tabs\" id=\"code-tabs-4\">\u003cdiv class=\"code-tabs__labels\" role=\"tablist\">\u003cbutton type=\"button\" class=\"code-tabs__label is-active\" data-tab=\"0\">cURL\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"1\">JavaScript\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"2\">Ruby\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"3\">PowerShell\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"4\">Python\u003c/button>\u003c/div>\u003cdiv class=\"code-tabs__panels\">\u003cdiv class=\"code-tabs__panel is-active\" data-tab=\"0\">\u003cdiv class=\"code-caption\">request the IIIF representation of a work\u003c/div>\u003cpre class=\"code-tabs__code language-bash\">\u003ccode>\u003cspan class=\"token function\">curl\u003c/span> \u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=iiif'\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"1\">\u003cdiv class=\"code-caption\">request the IIIF representation of a work\u003c/div>\u003cpre class=\"code-tabs__code language-javascript\">\u003ccode>\u003cspan class=\"token keyword\">let\u003c/span> response \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token keyword\">await\u003c/ ing-literal\">\u003cspan class=\"token string\">\"https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=iiif\"\u003c/span>\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;http \u003cspan class=\"token operator\">=\u003c/span> Net\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token class-name\">HTTP\u003c/span>\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token keyword\">new\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>url\u003cspan class=\"token punctuation\">.\u003c/span>host\u003cspan class=\"token punctuation\">,\u003c/span> url\u003cspan class=\"token punctuation\">.\u003c/span>port\u003cspan class=\"token punctuation\">)\u003c/span>&#10;http\u003cspan class=\"token punctuation\">.\u003c/span>use_ssl \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token boolean\">true\u003c/span>&#10;http\u003cspan class=\"token punctuation\">.\u003c/span>verify_mode \u003cspan class=\"token operator\">=\u003c/span> OpenSSL\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token constant\">SSL\u003c/span>\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token constant\">VERIFY_NONE\u003c/span>&#10;&#10;request \u003cspan class=\"token operator\">=\u003c/span> Net\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token constant\">HTTP\u003c/span>\u003cspan class=\"token double-colon punctuation\">::\u003c/span>\u003cspan class=\"token class-name\">Get\u003c/span>\u003cspan class=\"token punctuation\">.\u003c/span>\u003cspan class=\"token keyword\">new\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>url\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;response \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>request\u003cspan class=\"token punctuation\">)\u003c/span>&#10;puts response\u003cspan class=\"token punctuation\">.\u003c/span>read_body\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"3\">\u003cdiv class=\"code-caption\">request the IIIF representation of a work\u003c/div>\u003cpre class=\"code-tabs__code language-powershell\">\u003ccode>\u003cspan class=\"token variable\">$headers\u003c/span> = @\u003cspan class=\"token punctuation\">{\u003c/span>\u003cspan class=\"token punctuation\">}\u003c/span>&#10;\u003cspan class=\"token variable\">$reqUrl\u003c/span> = \u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=iiif'\u003c/span>&#10;&#10;\u003cspan class=\"token variable\">$response\u003c/span> = \u003cspan class=\"token function\">Invoke-RestMethod\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Uri \u003cspan class=\"token variable\">$reqUrl\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Method Get \u003cspan class=\"token operator\">-\u003c/span>Headers \u003cspan class=\"token variable\">$headers\u003c/span>&#10;\u003cspan class=\"token variable\">$response\u003c/span> \u003cspan class=\"token punctuation\">|\u003c/span> \u003cspan class=\"token function\">ConvertTo-Json\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"4\">\u003cdiv class=\"code-caption\">request the IIIF representation of a work\u003c/div>\u003cpre class=\"code-tabs__code language-python\">\u003ccode>\u003cspan class=\"token keyword\">import\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client&#10;&#10;conn \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client\u003cspan class=\"token punctuation\">.\u003c/span>HTTPSConnection\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"api.dc.library.northwestern.edu\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;conn\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"GET\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span> \u003cspan class=\"token string\">\"/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=iiif\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;response \u003cspan class=\"token operator\">=\u003c/span> conn\u003cspan class=\"token punctuation\">.\u003c/span>getresponse\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;result \u003cspan class=\"token operator\">=\u003c/span> response\u003cspan class=\"token punctuation\">.\u003c/span>read\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">print\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>result\u003cspan class=\"token punctuation\">.\u003c/span>decode\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"utf-8\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/div>\n\n## Image Thumbnails\n\nThumbnail images for collections and works are accessible by adding `/thumbnail` to a get request for a work or a collection. For example, [https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090/thumbnail](https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090/thumbnail) will return an image constrained to `300px` for the longest dimension (height or width). Modify the request with either or both optional parameters: `size` and `aspect`. So, if you want the same thumbnail as a `200px` square then make a request for [https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090/thumbnail?size=200&aspect=square](https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090/thumbnail?size=200&aspect=square). The maximum value for the `size` parameter is `300px`.\n\n# Response Formats\n\n## Introduction\n\nMost resources in this API can be served in more than one representation. A work, for\nexample, can be returned as the API's own JSON document, as a IIIF Presentation 3.0\nmanifest, as a PREMIS 3.0 record of the AI provenance of its metadata, or as a C2PA\nManifest Store carrying that record's Content Credentials.\n\nThere are two ways to ask for a representation, and they are interchangeable:\n\n- the `as` query parameter — `?as=iiif` — which is convenient in a browser, in a link,\n  or anywhere a request is just a URL; and\n- the HTTP `Accept` header, which is the standard mechanism and the better fit for a\n  client library that already sets headers.\n\nWhen a request carries both, **`as` wins**. The `Accept` header is only consulted when\nno `as` parameter is present.\n\nResponses that were negotiated carry `Vary: Accept`, so a shared cache will keep the\nrepresentations apart.\n\n## Formats\n\n| `as` value             | Media type                                                   | Applies to                                         |\n| ---------------------- | ------------------------------------------------------------ | -------------------------------------------------- |\n| `opensearch` (default) | `application/json`                                           | every resource and search endpoint                 |\n| `iiif`                 | `application/ld+json` with the IIIF Presentation 3 `profile` | works, collections, file sets, annotations, search |\n| `premis`               | `application/xml` (or `application/json`, see below)         | a single work                                      |\n| `c2pa`                 | `application/c2pa`                                           | a single work                                      |\n\nOmitting `as` — or sending a value the endpoint doesn't recognize — yields the default\nJSON representation.\n\n### Default (`as=opensearch`)\n\nThe API's own JSON envelope: a `data` member holding the document or list of documents,\nan `info` member, and, for search and other list responses, `pagination` and\n`aggregations`. This is what you get when you ask for nothing in particular, and it is\nthe representation every other one is derived from.\n\n\u003cdiv class=\"code-caption\">the default JSON representation of a work\u003c/div>\n\n```sh\ncurl 'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090'\n```\n\n### IIIF (`as=iiif`)\n\nA IIIF Presentation 3.0 resource: a Manifest for a work, a Collection for a collection\nor for a set of search results, a Canvas for a file set, and an AnnotationPage for a file\nset's annotations. The response is `application/ld+json` with the Presentation 3 context\nas its `profile` parameter, so a client that negotiates on the profile gets what it\nexpects. The IIIF section of the Overview describes what the manifests contain.\n\nOn search endpoints, `as=iiif` is only valid for a single model, either `works` or\n`collections`; asking for several models at once, or for `file-sets`, returns `400`.\n\n\u003cdiv class=\"code-caption\">IIIF representations\u003c/div>\n\n```sh\n# a work, as a Manifest\ncurl 'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=iiif'\n\n# search results, as a Collection\ncurl 'https://api.dc.library.northwestern.edu/api/v2/search/works?query=football&as=iiif'\n```\n\n### PREMIS (`as=premis`)\n\nA [PREMIS 3.0](https://www.loc.gov/standards/premis/) document describing the AI\nprovenance of a work's _metadata_ — the objects, events, agents, and rights statements\nrecorded when machine-generated description was applied to the record. The default\nresponse is XML, valid against the Library of Congress schema, and is served as\n`application/xml`.\n\nA work that no AI activity has touched is not an error: it returns a document describing\nthe work with no events, rather than a `404`.\n\n`as=premis` negotiates a second time on `Accept`. Where the request also sends\n`Accept: application/json`, the response is the PREMIS-shaped JSON projection as indexed,\nin the usual `data`/`info` envelope, instead of XML.\n\n\u003cdiv class=\"code-caption\">PREMIS provenance for a work\u003c/div>\n\n```sh\n# PREMIS 3.0 XML\ncurl 'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=premis'\n\n# the same provenance as JSON\ncurl -H 'Accept: application/json' \\\n  'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=premis'\n```\n\n### C2PA (`as=c2pa`)\n\nA [C2PA](https://c2pa.org) Manifest Store — Content Credentials — for a work's metadata\nrecord, served as `application/c2pa` with a `Content-Disposition` filename so that\nbrowsers and validators save it under the name they look for.\n\nThe manifest is **detached**: JSON has nowhere to embed one, so the manifest is signed on\nrequest and bound to the asset it describes by hash. That asset is the body of the\ndefault work response, _byte for byte_, which means a validator needs both the `.c2pa`\nfile and the unmodified `?as=opensearch` response to check the credentials. The default\nresponse advertises where to find its manifest in a `Link` header:\n\n```\nLink: \u003chttps://api.dc.library.northwestern.edu/api/v2/works/{id}?as=c2pa>; rel=\"c2pa-manifest\"\n```\n\nand the manifest response points back at the asset with `rel=\"describes\"`.\n\nTwo responses are worth planning for. Where signing is not configured in an environment,\n`as=c2pa` returns the unsigned manifest _definition_ as JSON with `info.c2pa.signed` set\nto `false` — a description of what would be signed, not a Content Credential. Where\nsigning is configured but fails, the response is `503` rather than an unsigned stand-in.\n\n\u003cdiv class=\"code-caption\">fetching and validating Content Credentials\u003c/div>\n\n```sh\n# the asset: exactly the bytes the manifest is bound to\ncurl -o work.json \\\n  'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090'\n\n# the detached manifest\ncurl -o work.c2pa \\\n  'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090?as=c2pa'\n```\n\n## The `Accept` header\n\nWhere no `as` parameter is present, the request's `Accept` header selects the format:\n\n| `Accept` contains        | Equivalent to   |\n| ------------------------ | --------------- |\n| `application/c2pa`       | `as=c2pa`       |\n| `application/json`       | `as=opensearch` |\n| `application/ld+json`    | `as=iiif`       |\n| `application/premis+xml` | `as=premis`     |\n\nThe header is parsed properly: quality values are honored, so\n`Accept: application/json;q=0.5, application/ld+json` returns IIIF, and `q=0` refuses a\ntype outright. A wildcard — `*/*`, or the long header a browser sends — asks for whatever\nthe endpoint serves by default.\n\nThe two mechanisms differ in how strict they are, by design:\n\n- **`as` is an instruction.** Naming a format the endpoint doesn't produce returns\n  `406 Not Acceptable`. Every endpoint answers the same way, so `?as=c2pa` on a search is\n  a `406` just as it is on a file set — it never falls back silently.\n- **`Accept` is a preference.** Where it asks for something the endpoint can't produce —\n  `Accept: text/csv`, say — it's disregarded and the default representation is served,\n  rather than the request being refused.\n\nThe exception to that fallback is an endpoint with no default representation: the two\ncontent-search routes serve IIIF and nothing else, so they answer only a request that\nasks for IIIF by name, and a request that states no preference gets a `406`.\n\nResponses from endpoints that negotiate carry `Vary: Accept`, so a shared cache keeps the\nrepresentations apart. Endpoints that serve only one thing — thumbnails, downloads, the\nauth routes — don't.\n\n\n\u003cdiv class=\"code-tabs\" id=\"code-tabs-5\">\u003cdiv class=\"code-tabs__labels\" role=\"tablist\">\u003cbutton type=\"button\" class=\"code-tabs__label is-active\" data-tab=\"0\">cURL\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"1\">JavaScript\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"2\">Ruby\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"3\">PowerShell\u003c/button>\u003cbutton type=\"button\" class=\"code-tabs__label\" data-tab=\"4\">Python\u003c/button>\u003c/div>\u003cdiv class=\"code-tabs__panels\">\u003cdiv class=\"code-tabs__panel is-active\" data-tab=\"0\">\u003cdiv class=\"code-caption\">request a work's IIIF manifest with an Accept header\u003c/div>\u003cpre class=\"code-tabs__code language-bash\">\u003ccode>\u003cspan class=\"token function\">curl\u003c/span> \u003cspan class=\"token parameter variable\">-H\u003c/span> \u003cspan class=\"token string\">'Accept: application/ld+json'\u003c/span> \u003cspan class=\"token punctuation\">\\\u003c/span>&#10;  \u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090'\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"1\">\u003cdiv class=\"code-caption\">request a work's IIIF manifest with an Accept header\u003c/div>\u003cpre class=\"code-tabs__code language-javascript\">\u003ccode>\u003cspan class=\"token keyword\">let\u003c/span> response \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token keyword\">await\u003c/span> \u003cspan class=\"token function\">fetch\u003c/span>\u003cspan class=\"token punctuation\"> "token punctuation\">]\u003c/span> \u003cspan class=\"token operator\">=\u003c/span> \u003cspan class=\"token string-literal\">\u003cspan class=\"token string\">\"application/ld+json\"\u003c/span>\u003c/span>&#10;&#10;response \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>request\u003cspan class=\"token punctuation\">)\u003c/span>&#10;puts response\u003cspan class=\"token punctuation\">.\u003c/span>read_body\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"3\">\u003cdiv class=\"code-caption\">request a work's IIIF manifest with an Accept header\u003c/div>\u003cpre class=\"code-tabs__code language-powershell\">\u003ccode>\u003cspan class=\"token variable\">$headers\u003c/span> = @\u003cspan class=\"token punctuation\">{\u003c/span> \u003cspan class=\"token string\">'Accept'\u003c/span> = \u003cspan class=\"token string\">'application/ld+json'\u003c/span> \u003cspan class=\"token punctuation\">}\u003c/span>&#10;\u003cspan class=\"token variable\">$reqUrl\u003c/span> = \u003cspan class=\"token string\">'https://api.dc.library.northwestern.edu/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090'\u003c/span>&#10;&#10;\u003cspan class=\"token variable\">$response\u003c/span> = \u003cspan class=\"token function\">Invoke-RestMethod\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Uri \u003cspan class=\"token variable\">$reqUrl\u003c/span> \u003cspan class=\"token operator\">-\u003c/span>Method Get \u003cspan class=\"token operator\">-\u003c/span>Headers \u003cspan class=\"token variable\">$headers\u003c/span>&#10;\u003cspan class=\"token variable\">$response\u003c/span> \u003cspan class=\"token punctuation\">|\u003c/span> \u003cspan class=\"token function\">ConvertTo-Json\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-tabs__panel\" data-tab=\"4\">\u003cdiv class=\"code-caption\">request a work's IIIF manifest with an Accept header\u003c/div>\u003cpre class=\"code-tabs__code language-python\">\u003ccode>\u003cspan class=\"token keyword\">import\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client&#10;&#10;conn \u003cspan class=\"token operator\">=\u003c/span> http\u003cspan class=\"token punctuation\">.\u003c/span>client\u003cspan class=\"token punctuation\">.\u003c/span>HTTPSConnection\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"api.dc.library.northwestern.edu\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;conn\u003cspan class=\"token punctuation\">.\u003c/span>request\u003cspan class=\"token punctuation\">(\u003c/span>&#10;    \u003cspan class=\"token string\">\"GET\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;    \u003cspan class=\"token string\">\"/api/v2/works/9f9a7032-717f-4446-a0c3-193404a4c090\"\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;    headers\u003cspan class=\"token operator\">=\u003c/span>\u003cspan class=\"token punctuation\">{\u003c/span>\u003cspan class=\"token string\">\"Accept\"\u003c/span>\u003cspan class=\"token punctuation\">:\u003c/span> \u003cspan class=\"token string\">\"application/ld+json\"\u003c/span>\u003cspan class=\"token punctuation\">}\u003c/span>\u003cspan class=\"token punctuation\">,\u003c/span>&#10;\u003cspan class=\"token punctuation\">)\u003c/span>&#10;response \u003cspan class=\"token operator\">=\u003c/span> conn\u003cspan class=\"token punctuation\">.\u003c/span>getresponse\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>&#10;&#10;\u003cspan class=\"token keyword\">print\u003c/span>\u003cspan class=\"token punctuation\">(\u003c/span>response\u003cspan class=\"token punctuation\">.\u003c/span>read\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">.\u003c/span>decode\u003cspan class=\"token punctuation\">(\u003c/span>\u003cspan class=\"token string\">\"utf-8\"\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003cspan class=\"token punctuation\">)\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003c/div>\n\n## Which formats apply where\n\n| Endpoint                                             | Formats                                          |\n| ---------------------------------------------------- | ------------------------------------------------ |\n| `/works/{id}`                                        | default, `iiif`, `premis`, `c2pa`                |\n| `/works/{id}/search`                                 | `iiif` only — a request without it returns `406` |\n| `/collections`, `/collections/{id}`                  | default, `iiif`                                  |\n| `/file-sets/{id}`                                    | default, `iiif`                                  |\n| `/file-sets/{id}/annotations`, `/annotations/{id}`   | default, `iiif`                                  |\n| `/file-sets/{id}/search`                             | `iiif` only — a request without it returns `406` |\n| `/search`, `/search/{models}`, `/works/{id}/similar` | default, `iiif`                                  |\n\n`premis` and `c2pa` describe a single work's metadata record, so they are meaningful only\non `/works/{id}`; elsewhere they result in a `406 Not Acceptable` error response.\n\n### IIIF content-search excerpts\n\nThe work and file-set content-search endpoints return the full matching\ntranscriptions in `items`. Their `annotations` array contains a context\nAnnotationPage with one `contextualizing` annotation per literal,\ncase-insensitive occurrence of the query. Each targets the matching annotation\nID and supplies a `TextQuoteSelector`: `exact` preserves the matched text,\n`prefix` contains up to 60 preceding characters, and `suffix` contains up to\n100 following characters (one fewer at an edge rather than split an emoji or\nother surrogate pair). Context remains verbatim plain text, without HTML or\nadded ellipses. A response includes at most 100 context annotations, taken in\n`items` order, so very common queries return every matching transcription but\nonly the first 100 excerpts. When nothing matches, `annotations` is omitted.\n\nThis follows [IIIF Content Search 2.0 match context](https://iiif.io/api/search/2.0/#431-match-context)\nand allows compatible viewers, including Clover 4.1, to display short excerpts\nand highlight only the matched phrase. Canvas targets and full transcriptions\nremain unchanged; the response does not add word coordinates on the image.\n\n# Protocol for Metadata Harvesting (OAI-PMH)\n\n## Introduction\n\nThe Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH) is a protocol that enables the harvesting of metadata descriptions of records in a repository. The Digital Collections API is an OAI-PMH `Data Provider`, which means structured metadata is exposed according to the [OAI-PMH specification](http://www.openarchives.org/OAI/openarchivesprotocol.html). OAI-PMH is a set of verbs or services that are invoked using the HTTP protocol. The OAI-PMH endpoint is available at `https://api.dc.library.northwestern.edu/api/v2/oai`.\n\nPlease see the [OpenAPI specification](#tag/OAI-PMH) for more information about making requests using each OAI-PMH verb, including parameters and examples.\n\n## Verbs\n\nAll six verbs are supported:\n\n- `GetRecord`: Retrieves metadata records from a repository.\n- `Identify`: Provides information about the repository and its policies.\n- `ListIdentifiers`: Returns a list of headers for records, without the actual metadata records.\n- `ListMetadataFormats`: Lists the metadata formats supported by the repository.\n- `ListRecords`: Returns a list of records, along with metadata records.\n- `ListSets`: Lists the sets or collections available in the repository.\n\n## Metadata Formats\n\nTwo metadata formats are supported via the `metadataPrefix` parameter:\n\n- `oai_dc`: [Dublin Core](http://www.openarchives.org/OAI/2.0/oai_dc.xsd), the format required by the OAI-PMH specification.\n- `mods`: [MODS v3.7](http://www.loc.gov/standards/mods/v3/mods-3-7.xsd), which provides richer metadata, including names with authority URIs and roles, typed subjects, rights statement URIs, and links to the item and its thumbnail.\n\nFor example: `?verb=GetRecord&identifier=\u003cid>&metadataPrefix=mods`","version":"2.0.0","contact":{"name":"NUL Repository Team","email":"repository@northwestern.edu"}},"servers":[{"url":"https://api.dc.library.northwestern.edu/api/v2"}],"tags":[{"name":"Collection"},{"name":"FileSet"},{"name":"Work"},{"name":"Annotation"},{"name":"Search","description":"Endpoints for searching the index.\n"},{"name":"Authentication","description":"Endpoints for authenticating and obtaining information about the current user.\n"},{"name":"OAI-PMH","description":"Endpoint implementing the Open Archives Initiative Protocol for Metadata Harvesting (OAI-PMH). As OAI-PMH is not a REST protocol, it is difficult to represent using OpenAPI/Swagger documentation. For full documentation and examples, please see the [official specification](https://www.openarchives.org/pmh/). Note: all 'from' and 'until' query parameters must follow the OAI-PMH specification and use either 'YYYY-MM-DD' or 'YYYY-MM-DDThh:mm:ssZ'. If you do not need second-level precision, use the date-only form.\n"}],"x-tagGroups":[{"name":"Models","tags":["Collection","FileSet","Work","Annotation"]},{"name":"Authentication & Search","tags":["Authentication","Search"]},{"name":"Other Protocols","tags":["OAI-PMH","MCP"]}],"components":{"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer","bearerFormat":"JWT"}},"parameters":{"models":{"name":"models","in":"path","description":"Comma-delimited list of models to search","required":true,"schema":{"type":"array","items":{"
