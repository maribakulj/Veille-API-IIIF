    <script data-ref="ignore">
        window.__INITIAL_STATE__ = JSON.parse("{\"intl\":{\"locale\":\"en_US\",\"messages\":{\"SITE_CONFIG_aboutPageHtml\":\"\u0026amp;lt;h3\u0026amp;gt;Reproductions of Huntington Library Holdings\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;As part of its mission to make the collections available for research and outreach, The Huntington provides reproductions of materials for scholarly and general use. Requests are fulfilled to the extent allowed by the format, physical condition, and any applicable restrictions. We are eager to hear from Creators\/Makers and\/or Copyright Holders who are not properly identified so that appropriate information may be provided in the future.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u0026amp;lt;strong\u0026amp;gt;Notice as of March 2015\u0026amp;lt;\/strong\u0026amp;gt;: Some older catalog records and finding aids may contain obsolete permissions language; current policies are outlined below.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;For commercial product licensing requests, please contact \u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:jbrown\u0026#64;huntington.org\u0026amp;quot;\u0026amp;gt;Licensing and Product Development.\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Ordering Reproductions\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;Visit \u0026amp;lt;a title\u0026#61;\u0026amp;quot;Library Services\u0026amp;quot; href\u0026#61;\u0026amp;quot;https:\/\/www.huntington.org\/library-services\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Library Services\u0026amp;lt;\/a\u0026amp;gt; for the Imaging Services Guide and Price List. Requests for reproductions of library materials should be submitted through \u0026amp;lt;a title\u0026#61;\u0026amp;quot;Aeon\u0026amp;quot; href\u0026#61;\u0026amp;quot;https:\/\/aeon.huntington.org\/aeon\/aeon.dll?Action\u0026#61;10\u0026amp;amp;Form\u0026#61;79\u0026amp;amp;_gl\u0026#61;1*11son7h*_gcl_au*MTQxNDA3MTkxNy4xNzQ0MDQyOTg0*_ga*MjA5ODAzMDgzMi4xNzQ0MDQyOTgx*_ga_1BGEDHGTJ6*MTc0NDA0Mjk4MS4xLjEuMTc0NDA0MzEwMy42MC4wLjA.\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Aeon\u0026amp;lt;\/a\u0026amp;gt;, our electronic request system.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Quoting or Reproducing Huntington Library Materials\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;The Huntington is committed to supporting scholarly research and the dissemination of research through various forms of publication and outreach. While the Library owns the physical objects in its collections, in the majority of cases we do not own the intellectual content or copyright and cannot grant or deny permission to publish. Certain works requested which are physically owned by The Huntington may be protected by copyright, trademark, or related interests not owned by The Huntington. Copyright law protects unpublished as well as published materials. The responsibility for determining whether any such intellectual property rights, including moral rights, exist, for obtaining all necessary permissions, and for guarding against the infringement of those rights that may be held elsewhere, remains with the requester. If the content in question is under copyright, appropriate permissions must be sought from the owner of the rights, unless the intended use is protected by the fair use provision of U.S. copyright law (title 17, United States Code). Some ownership and rights information may be recorded in our catalog records and finding aids. Questions and requests should be addressed to \u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:reference\u0026#64;huntington.org\u0026amp;quot;\u0026amp;gt;reference\u0026#64;huntington.org\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Warning Concerning Copyright Restrictions\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;The copyright law of the United States (Title 17, United States Code) governs the making of photocopies or other reproductions of copyrighted materials. Under certain conditions specified in the law, libraries and archives are authorized to furnish a photocopy or other reproduction. One of these specified conditions is that the photocopy or reproduction is not to be \u201Cused for any purpose other than private study, scholarship, or research.\u201D If a user makes a request for, or later uses, a photocopy or reproduction for purposes in excess of \u201Cfair use,\u201D that user may be liable for copyright infringement.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;Other tools exist for researching copyright, including the \u0026amp;lt;a title\u0026#61;\u0026amp;quot;WATCH File\u0026amp;quot; href\u0026#61;\u0026amp;quot;http:\/\/norman.hrc.utexas.edu\/watch\/\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;WATCH File\u0026amp;lt;\/a\u0026amp;gt; (Writers, Artists, and Their Copyright Holders) maintained \u00A0by the Harry Ransom Center and the University of Reading and the \u0026amp;lt;a title\u0026#61;\u0026amp;quot;public database\u0026amp;quot; href\u0026#61;\u0026amp;quot;http:\/\/www.copyright.gov\/records\/\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;public database\u0026amp;lt;\/a\u0026amp;gt; at the U.S. Copyright Office, which contains information on all works registered after January 1, 1978. Additional tools that may be useful are: \u0026amp;lt;a title\u0026#61;\u0026amp;quot;Copyright Term and the Public Domain in the United States\u0026amp;quot; href\u0026#61;\u0026amp;quot;https:\/\/copyright.cornell.edu\/resources\/publicdomain.cfm\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Copyright Term and the Public Domain in the United States\u0026amp;lt;\/a\u0026amp;gt;, Peter B. Hirtle, the Cornell Copyright Information Center; the \u0026amp;lt;a title\u0026#61;\u0026amp;quot;Digital Copyright Slider\u0026amp;quot; href\u0026#61;\u0026amp;quot;http:\/\/librarycopyright.net\/resources\/digitalslider\/\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Digital Copyright Slider\u0026amp;lt;\/a\u0026amp;gt;, from the \u0026amp;lt;a title\u0026#61;\u0026amp;quot;Copyright Advisory Network\u0026amp;quot; href\u0026#61;\u0026amp;quot;http:\/\/librarycopyright.net\/\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Copyright Advisory Network\u0026amp;lt;\/a\u0026amp;gt;; and \u0026amp;lt;a title\u0026#61;\u0026amp;quot;How to Investigate the Copyright Status of a Work\u0026amp;quot; href\u0026#61;\u0026amp;quot;http:\/\/www.copyright.gov\/circs\/circ22.pdf\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;How to Investigate the Copyright Status of a Work\u0026amp;lt;\/a\u0026amp;gt; (pdf), from the U.S. Copyright Office.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;We welcome information about copyright and related matters pertaining to materials in our collections. If you have such information, or believe that our website and records do not accurately and fully record any applicable restrictions please email\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:reference\u0026#64;huntington.org\u0026amp;quot;\u0026amp;gt;reference\u0026#64;huntington.org\u0026amp;lt;\/a\u0026amp;gt;.\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Quoting from Unpublished Materials\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;You do not need to contact the Library for permission to quote from unpublished material such as a manuscript or letter. However, for the benefit of future researchers and in order to assist in developing the collection, we ask that you inform us if you are publishing a substantial portion of a manuscript or an entire letter, or a work that relies upon a Huntington manuscript for its text. Please contact \u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:reference\u0026#64;huntington.org\u0026amp;quot;\u0026amp;gt;reference\u0026#64;huntington.org\u0026amp;lt;\/a\u0026amp;gt; with this information.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Crediting The Huntington\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;As a matter of good scholarly practice and for the benefit of future researchers, we ask that requesters using reproductions of our materials give appropriate credit when quoting from, or reproducing an item in the Huntington collections. Images should be captioned with information about the original source, and quotations should be footnoted. For more information, visit\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/aeon.huntington.org\/aeon\/files\/citationguidelines.pdf\u0026amp;quot; title\u0026#61;\u0026amp;quot;Guidelines\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;citation guidelines\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Citing The Huntington\u0026amp;lt;span style\u0026#61;\u0026amp;quot;line-height: 1.5;\u0026amp;quot;\u0026amp;gt;\u00A0\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;The Huntington Library asks that researchers identify and cite specific item information when quoting from materials held by the Library. For more information, visit \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/aeon.huntington.org\/aeon\/files\/citationguidelines.pdf\u0026amp;quot; title\u0026#61;\u0026amp;quot;Guidelines\u0026amp;quot;\u0026amp;gt;citation guidelines\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Inquiries Regarding Art and Botanical Materials\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;For permission to reproduce images or texts of materials from The Huntington Art Collections, visit\u00A0\u0026amp;lt;a title\u0026#61;\u0026amp;quot;Art Collections Rights and Reproductions\u0026amp;quot; href\u0026#61;\u0026amp;quot;https:\/\/www.huntington.org\/art-collections-rights-and-reproductions\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Art Collections Rights and Reproduction\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;To reproduce images or texts of materials from The Huntington Botanical Collections, contact \u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:drudeen\u0026#64;huntington.org\u0026amp;quot;\u0026amp;gt;Botanical Rights and Reproduction\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Regarding Historical Materials containing Offensive Language or Negative Stereotypes\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;The Huntington Library offers broad public access through our digital collections to a wide range of information, including historical materials that may contain offensive language or negative stereotypes. Such materials must be viewed in the context of the relevant time period. The Huntington Library, Art Museum, and Botanical Gardens does not endorse the views expressed in such materials.\u0026amp;lt;\/p\u0026amp;gt;\",\"SITE_CONFIG_aboutPageTitle\":\"Use of Materials and Reproductions\",\"SITE_CONFIG_breadcrumbTopLevelText\":\"Home\",\"SITE_CONFIG_customHomePageAltText\":\"\",\"SITE_CONFIG_downloadExtraLargeEnabled\":\"Publication Resolution (up to 2000 x 2000 pixels)\",\"SITE_CONFIG_downloadFullResEnabled\":\"Full Resolution\",\"SITE_CONFIG_downloadFullSizeEnabled\":\"Full Resolution\",\"SITE_CONFIG_downloadLargeEnabled\":\"Large\",\"SITE_CONFIG_downloadMediumEnabled\":\"Web Resolution (up to 500 x 500 pixels)\",\"SITE_CONFIG_downloadSmallEnabled\":\"Web Res (250x250 max)\",\"SITE_CONFIG_globalHomePageHtml\":\"\u0026amp;lt;h1\u0026amp;gt;Huntington Digital Library\u0026amp;lt;\/h1\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;The Huntington Digital Library is the online database of Huntington Library digitized materials. It aims to support the research needs of Huntington readers and staff and to share digitized resources with a broader community. New content is regularly added, yet only a fraction of the Huntington Library\u2019s more than eleven million items is available in digitized form.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;Visit \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/www.huntington.org\/library-collections\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Library Collections\u0026amp;lt;\/a\u0026amp;gt; to learn more about The Huntington Library\u2019s collection strengths. Researchers may consult the \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/catalog.huntington.org\/\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Huntington Library Catalog\u0026amp;lt;\/a\u0026amp;gt; for detailed descriptions of the Library\u2019s holdings. See \u0026amp;quot;\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/hdl.huntington.org\/digital\/search\/searchterm\/Part%20of%20the%20Library%20Main%20Hall%20exhibition\/field\/all\/mode\/exact\/conn\/and\/order\/date\u0026amp;quot;\u0026amp;gt;Remarkable Works, Remarkable Times: Highlights from The Huntington Library\u0026amp;quot;\u0026amp;lt;\/a\u0026amp;gt; for materials related to the past exhibition of the same name.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;The Huntington Digital Library\u2019s collections contain historical and contemporary content that include images or language which library users may find harmful, offensive, or inappropriate. Please see the Library\u0026amp;apos;s \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/researchguides.huntington.org\/usingthelibrary\/content_statement\u0026amp;quot; title\u0026#61;\u0026amp;quot;Harmful Content statement\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Statement on Harmful Content in the Collection and its Description\u0026amp;lt;\/a\u0026amp;gt; on how staff are addressing this content.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;See \u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/hdl.huntington.org\/digital\/about\u0026amp;quot;\u0026amp;gt;Use of Materials and Reproductions\u0026amp;lt;\/a\u0026amp;gt; for information on copyright and permission to publish.\u0026amp;lt;\/p\u0026amp;gt;\",\"SITE_CONFIG_homePageHtml\":\"\u0026lt;p\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;color: #808080;\u0026#34;\u0026gt;The Huntington Library is one of the world\u2019s great independent research libraries specializing in the fields of British and American history, literature and the history of science spanning the 11th century to the present. Among the collections are 7 million manuscripts, 420,000 rare books, 270,000 general collection books, and 1.3 million photographs, prints, and ephemera.\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;color: #808080;\u0026#34;\u0026gt;\u00A0\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;color: #808080;\u0026#34;\u0026gt;The Huntington Digital Library, representing only a fraction of our holdings, is an online tool to aid in the dissemination of these rich and unique collections. It is designed to support the research needs of Huntington readers and staff, and to share digitized resources with the broader community. This is not a static site, we are actively adding new content to our online collections. Go see \u0026lt;a title\u0026#61;\u0026#34;Remarkable Works, Remarkable Times\u0026#34; href\u0026#61;\u0026#34;http:\/\/cdm16003.contentdm.oclc.org\/cdm\/search\/searchterm\/Part%20of%20the%20Library%20Main%20Hall%20exhibition\/field\/all\/mode\/exact\/conn\/and\/order\/date\u0026#34;\u0026gt;Remarkable Works, Remarkable Times: Highlights from the Huntington Library\u0026lt;\/a\u0026gt; for material related to the reopening of the Library Main Hall.\u00A0 See \u0026lt;a title\u0026#61;\u0026#34;Your Country Calls!\u0026#34; href\u0026#61;\u0026#34;http:\/\/hdl.huntington.org\/cdm\/search\/collection\/p9539coll1\/searchterm\/Your%20Country%20Calls\/mode\/exact\u0026#34;\u0026gt; Your Country Calls!\u0026lt;\/a\u0026gt; for material related to the exhibit from Fall 2014.\u0026lt;br \/\u0026gt;\u0026lt;\/span\u0026gt;\u0026lt;\/p\u0026gt;\\n\u0026lt;p\u0026gt;\u00A0\u0026lt;\/p\u0026gt;\\n\u0026lt;p\u0026gt;\u0026lt;span style\u0026#61;\u0026#34;color: #808080;\u0026#34;\u0026gt;Visit The Huntington Library, Art Collections, and Botanical Gardens \u0026lt;a href\u0026#61;\u0026#34;http:\/\/www.huntington.org\/\u0026#34; target\u0026#61;\u0026#34;_blank\u0026#34;\u0026gt;website\u0026lt;\/a\u0026gt; for more information about the institution. See the \u0026lt;a href\u0026#61;\u0026#34;\/cdm\/about\u0026#34;\u0026gt;About\/Use of Materials\u0026lt;\/a\u0026gt; page for information on copyright and permission to publish. Researchers should consult our \u0026lt;a href\u0026#61;\u0026#34;http:\/\/catalog.huntington.org\/\u0026#34; target\u0026#61;
