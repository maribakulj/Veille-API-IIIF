<!DOCTYPE html>
<html>

<head>
    <title>404 Not Found</title>
    <style>
        * {
            transition: all 0.6s;
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Lato', sans-serif;
            color: #888;
            margin: 0;
        }

        #main {
            display: table;
            width: 100%;
            height: 100vh;
            text-align: center;
        }

        .err {
            display: table-cell;
            vertical-align: middle;
        }

        .err h1 {
            font-size: 50px;
            display: inline-block;
            padding-right: 12px;
            animation: type .5s alternate infinite;
            margin: 0;
        }

        @keyframes type {
            from {
                box-shadow: inset -3px 0px 0px #888;
            }

            to {
                box-shadow: inset -3px 0px 0px transparent;
            }
        }
    </style>
</head>

<body>
    <div id="main">
        <div class="err">
            <h1>404 Not Found</h1>
            <p>This resource does not seem to exist.</p>
        </div>
    </div>
</body>

</html>
