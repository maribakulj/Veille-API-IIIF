mp;lt;p\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Take down policy\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;Special Collections Online seeks to retain everything that has been digitised. It is possible, however, that there will be circumstances when we will need to remove an item, and\/or its associated record (the metadata). These circumstances include copyright violation, plagiarism or libel. Requests to remove items should be made to the Special Collections team by email:\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:specialcollections\u0026#64;leicester.ac.uk\u0026amp;quot;\u0026amp;gt;specialcollections\u0026#64;leicester.ac.uk\u0026amp;lt;\/a\u0026amp;gt;.\u00A0 All requests will be dealt with in accordance with our\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/le.ac.uk\/library\/about\/policies\/special-collections-online-takedown-policy\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;Takedown Policy\u0026amp;lt;\/a\u0026amp;gt;.\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Prints of originals\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;We are unable to supply prints of originals included on this website.\u00A0\u00A0\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;h3\u0026amp;gt;Contact us\u0026amp;lt;\/h3\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;Archives and Special Collections,\u0026amp;lt;br \/\u0026amp;gt;University Library,\u0026amp;lt;br \/\u0026amp;gt;University of Leicester,\u0026amp;lt;br \/\u0026amp;gt;University Road,\u0026amp;lt;br \/\u0026amp;gt;Leicester,\u0026amp;lt;br \/\u0026amp;gt;LE1\u00A07RH,\u0026amp;lt;br \/\u0026amp;gt;United Kingdom\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;\u0026amp;lt;span data-mce-mark\u0026#61;\u0026amp;quot;1\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;T: 0116 252 2056\u0026amp;lt;br \/\u0026amp;gt;E:\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:specialcollections\u0026#64;leicester.ac.uk\u0026amp;quot;\u0026amp;gt;specialcollections\u0026#64;leicester.ac.uk\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;br \/\u0026amp;gt;W:\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/le.ac.uk\/library\/special-collections\u0026amp;quot; target\u0026#61;\u0026amp;quot;_blank\u0026amp;quot;\u0026amp;gt;https:\/\/le.ac.uk\/library\/special-collections\u0026amp;lt;\/a\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\",\"SITE_CONFIG_aboutPageTitle\":\"About\",\"SITE_CONFIG_breadcrumbTopLevelText\":\"Home\",\"SITE_CONFIG_customHomePageAltText\":\"\",\"SITE_CONFIG_downloadExtraLargeEnabled\":\"Extra Large\",\"SITE_CONFIG_downloadFullResEnabled\":\"Full Resolution\",\"SITE_CONFIG_downloadFullSizeEnabled\":\"large ( \u0026gt; 500x500)\",\"SITE_CONFIG_downloadLargeEnabled\":\"Large\",\"SITE_CONFIG_downloadMediumEnabled\":\"medium (500x500 max)\",\"SITE_CONFIG_downloadSmallEnabled\":\"small (250x250 max)\",\"SITE_CONFIG_globalHomePageHtml\":\"\u0026amp;lt;h1 class\u0026#61;\u0026amp;quot;cdmstyle\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;span data-mce-mark\u0026#61;\u0026amp;quot;1\u0026amp;quot;\u0026amp;gt;Special Collections Online\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/h1\u0026amp;gt;\\n\u0026amp;lt;p\u0026amp;gt;Welcome to our\u00A0online heritage collections, free and open to all. Building on our strengths in local, urban and industrial history you can find\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;http:\/\/cdm16445.contentdm.oclc.org\/cdm\/landingpage\/collection\/p16445coll4\u0026amp;quot;\u0026amp;gt;Historical Directories\u0026amp;lt;\/a\u0026amp;gt;\u00A0here and many resources for the history of Leicester and\u00A0Leicestershire.\u00A0We also have sources about the University of Leicester, museum studies and the writer Evelyn Waugh.\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p class\u0026#61;\u0026amp;quot;cdmstyle\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;span\u0026amp;gt;\u0026amp;lt;span\u0026amp;gt;Much of the material comes from the University Library\u0026amp;apos;s holdings of rare books, images and archives. We also host collections created by research projects and external partners.\u00A0We have a growing specialism in digital oral history and sound, thanks to our collaboration with East Midlands Oral History Archive.\u00A0Most of our collections can now be used with\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/youtu.be\/BdWLLVFy9Rk\u0026amp;quot;\u0026amp;gt;IIIF\u0026amp;lt;\/a\u0026amp;gt;.\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;o:p\u0026amp;gt;\u0026amp;lt;\/o:p\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\\n\u0026amp;lt;p class\u0026#61;\u0026amp;quot;cdmstyle\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;span data-mce-mark\u0026#61;\u0026amp;quot;1\u0026amp;quot;\u0026amp;gt;\u0026amp;lt;u3:p\u0026amp;gt;\u0026amp;lt;\/u3:p\u0026amp;gt;\u0026amp;lt;span data-mce-mark\u0026#61;\u0026amp;quot;1\u0026amp;quot;\u0026amp;gt;Visit the\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;https:\/\/le.ac.uk\/library\/special-collections\u0026amp;quot;\u0026amp;gt;Archives and Special Collections\u0026amp;lt;\/a\u0026amp;gt;\u00A0pages for more information about our services.\u00A0Have any questions? Get in touch:\u00A0\u0026amp;lt;a href\u0026#61;\u0026amp;quot;mailto:specialcollections\u0026#64;leicester.ac.uk\u0026amp;quot;\u0026amp;gt;specialcollections\u0026#64;leicester.ac.uk\u0026amp;lt;\/a\u0026amp;gt;.\u00A0\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;o:p\u0026amp;gt;\u0026amp;lt;\/o:p\u0026amp;gt;\u0026amp;lt;\/span\u0026amp;gt;\u0026amp;lt;\/p\u0026amp;gt;\",\"SITE_CONFIG_homePageHtml\":\"\u0026lt;p class\u0026#61;\u0026#34;cdm_style spaceMar10B\u0026#34; style\u0026#61;\u0026#34;text-align: justify;\u0026#34;\u0026gt;\u0026lt;a title\u0026#61;\u0026#34;University of Leicester Library\u0026#34; href\u0026#61;\u0026#34;http:\/\/www2.le.ac.uk\/library\u0026#34; target\u0026#61;\u00
